name: SteamFlow Rust Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    paths:
      - "src/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yaml"

jobs:
  steamflow-deb:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libgtk-3-dev \
            libpulse-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build SteamFlow (release)
        run: cargo build --release

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        run: cargo deb --no-build

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: steamflow-deb
          path: target/debian/*.deb
          archive: false

  steamflow-windows:
    # Disabled: SteamFlow is a Linux-native launcher (uses xdg-open, egui/eframe).
    # Windows cross-compilation is not supported in the current architecture.
    # Set to 'runs-on: ubuntu-24.04' and restore steps to re-enable Linux builds.
    runs-on: ubuntu-24.04
    if: false  # Explicitly disabled until native Linux build is properly separated
